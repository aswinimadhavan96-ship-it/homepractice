<!DOCTYPE html>
<html>
<head>
    <title>Theme Preference Using Cookies</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            transition: 0.3s;
        }

        .light {
            background-color: white;
            color: black;
        }

        .dark {
            background-color: black;
            color: white;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <h1>Theme Preference Using Cookies</h1>

    <button onclick="setTheme('light')">
        Light Mode
    </button>

    <button onclick="setTheme('dark')">
        Dark Mode
    </button>

    <script>

                function setCookie(name, value, days) {

            let date = new Date();

            date.setTime(
                date.getTime() + (days * 24 * 60 * 60 * 1000)
            );

            let expires =
                "expires=" + date.toUTCString();

            document.cookie =
                name + "=" + value + ";" +
                expires + ";path=/";
        }

                function getCookie(name) {

            let cookieArray =
                document.cookie.split(";");

            for(let i = 0; i < cookieArray.length; i++) {

                let cookie =
                    cookieArray[i].trim();

                if(cookie.startsWith(name + "=")) {

                    return cookie.substring(
                        name.length + 1
                    );
                }
            }

            return "";
        }

                function setTheme(theme) {

            document.body.className = theme;

            setCookie(
                "theme",
                theme,
                30
            );
        }

        
        window.onload = function() {

            let savedTheme =
                getCookie("theme");

            if(savedTheme) {

                document.body.className =
                    savedTheme;

            } else {

                document.body.className =
                    "light";
            }
        };

    </script>

</body>
</html>
